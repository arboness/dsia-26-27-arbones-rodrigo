name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            proyecto_i_a/requirements.txt
            proyecto_i_b/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r proyecto_i_a/requirements.txt -r proyecto_i_b/requirements.txt

      - name: Parte A - tests + coverage (ventas_app)
        working-directory: proyecto_i_a
        run: pytest -q --cov=ventas_app --cov-report=term-missing --cov-fail-under=60

      - name: Parte B - tests + coverage (spotify_app)
        working-directory: proyecto_i_b
        run: pytest -q --cov=spotify_app --cov-report=term-missing --cov-fail-under=60
