[project]
name = "ventas-app"
version = "0.1.0"
description = "Proyecto I (Parte A): pipeline de calidad de datos de ventas con validación, métricas, CLI y tests."
readme = "README.md"
authors = [
    { name = "Rodrigo Arbones V", email = "120335790+arboness@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
]

[project.scripts]
ventas-app = "ventas_app.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ventas_app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests que leen datos reales del curso (Datos/ventas.csv)",
]

[tool.coverage.run]
branch = true
